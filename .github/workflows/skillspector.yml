name: SkillSpector

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillspector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Scan alf skills and upstream skills
        run: task ci
      - name: Explain a failed scan
        if: failure()
        run: |
          {
            echo "### SkillSpector check failed"
            echo
            echo "The log above lists each finding or scan error. [How to fix or accept findings](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/skillspector.md)."
          } >> "$GITHUB_STEP_SUMMARY"
